name: 52W High Screener

on:
  schedule:
    # 15:15 UTC = 20:45 IST, Monday-Friday
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: 52w-high-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run 52W High Screener
        run: python -m app.high_52w_main
