name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify project structure
        run: |
          pwd
          ls -la
          ls -la app
          python -c "import app; from app.main import add; print('Import OK:', add(2, 3))"

      - name: Run tests
        run: python -m pytest -v
