name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest requests

      - name: Verify dependencies
        run: python -c "import pytest, requests; print('pytest and requests OK')"

      - name: Verify application import
        run: python -c "import app; import app.main; print('Application import OK')"

      - name: Run tests
        run: python -m pytest -v
