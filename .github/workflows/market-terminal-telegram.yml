name: EQSIS Style Market Terminal Telegram

on:
  schedule:
    # 15:15 UTC = 20:45 IST, Monday-Friday
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-terminal-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send EQSIS-style terminal notification
        run: python -m market_terminal.telegram_notify
